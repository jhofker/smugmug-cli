services:
  # Scheduled backup: every file under /photos goes into private albums by
  # the day it was taken (Backup/YYYY/MM/YYYY-MM-DD). After the first run,
  # unchanged files are only stat'ed, so later runs are cheap.
  backup:
    # Use pre-built image from GitHub Container Registry
    image: ghcr.io/jhofker/smugmug-cli:latest
    # Or build locally by uncommenting the line below and commenting out 'image:'
    # build: .
    command: backup /photos --interval 6h --exclude "old_backup/"
    restart: unless-stopped
    # Let in-progress uploads finish on `docker stop`
    stop_grace_period: 2m
    environment:
      # Match your host user to avoid permission issues
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      # Time zone videos are dated in (their metadata is in UTC)
      - TZ=${TZ:-America/Chicago}
      # SmugMug credentials (use .env file or pass directly); with these
      # set, no config file is needed
      - SMUGMUG_API_KEY=${SMUGMUG_API_KEY}
      - SMUGMUG_API_SECRET=${SMUGMUG_API_SECRET}
      - SMUGMUG_ACCESS_TOKEN=${SMUGMUG_ACCESS_TOKEN}
      - SMUGMUG_ACCESS_TOKEN_SECRET=${SMUGMUG_ACCESS_TOKEN_SECRET}
      # Low priority on the host (defaults shown; set empty to disable)
      # - NICE=10
      # - IONICE_CLASS=3
    volumes:
      # Config (optional with the variables above) and cache. The cache
      # must persist: it's what lets later runs skip unchanged files.
      - ${CONFIG_DIR:-~/.config/smugmug-cli}:/home/smugmug/.config/smugmug-cli
      - ${CACHE_DIR:-~/.cache/smugmug-cli}:/home/smugmug/.cache/smugmug-cli
      # Photos directory (read-only). Mount several folders under /photos
      # to back up only those.
      - ${PHOTOS_DIR:-./photos}:/photos:ro
    # Optional caps
    # cpus: 2
    # mem_limit: 2g

  # One-off upload into a named album
  # upload:
  #   image: ghcr.io/jhofker/smugmug-cli:latest
  #   command: upload /photos --album "My Photos" --threads 8
  #   environment: (as above)
  #   volumes: (as above)
