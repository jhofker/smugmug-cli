name: Publish to crates.io

# Publishes the crate when a version tag is pushed, alongside the cargo-dist
# release (release.yml) and Docker image (docker-publish.yml) workflows.
#
# Uses crates.io trusted publishing (OIDC), so no API token is stored. This must
# be configured once on crates.io (crate settings -> Trusted Publishing) after
# the first manual `cargo publish`: repository jhofker/smugmug-cli, workflow
# crates-publish.yml.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
