[package]
name = "smugmug-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
authors = ["Jordan Hofker <jhofker@gmail.com>"]
description = "A command-line tool for uploading photos to SmugMug with deduplication"
license = "MIT"
repository = "https://github.com/jhofker/smugmug-cli"
homepage = "https://github.com/jhofker/smugmug-cli"
readme = "README.md"
keywords = ["smugmug", "photos", "upload", "cli", "deduplication"]
categories = ["command-line-utilities", "multimedia::images"]
# Whitelist so stray files in the working tree never end up in the published crate
include = [
    "src/**/*.rs",
    "src/**/*.md",
    "tests/**/*.rs",
    "licenses/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "THIRD-PARTY-NOTICES.md",
]

[lib]
name = "smugmug_cli"
path = "src/lib.rs"

[[bin]]
name = "smugmug-cli"
path = "src/main.rs"

[dependencies]
# HTTP & API
# native-tls (OpenSSL) rather than 0.13's default rustls/aws-lc, which needs cmake to build
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "multipart", "query", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
oauth1-request = "0.6"
hmac = "0.13"
sha1 = "0.11"
md5 = "0.8"
hex = "0.4"
base64 = "0.23"
bytes = "1"

# CLI & UX
clap = { version = "4.6", features = ["derive", "env"] }
indicatif = "0.18"
colored = "3.1"

# Async runtime
tokio = { version = "1.53", features = ["full"] }
rayon = "1.12"

# File operations
walkdir = "2.5"
sha2 = "0.11"
mime_guess = "2.0"

# Storage
sled = "0.34"
directories = "6.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
dialoguer = "0.12"
dotenvy = "0.15"

# RAW → JPEG for accounts without SmugMug Source (src/raw/). rawler is
# LGPL-2.1: see THIRD-PARTY-NOTICES.md. 0.8 needs Rust 1.89.
rawler = "0.8"
little_exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]
mockito = "1.7"
tempfile = "3.27"
tokio-test = "0.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
